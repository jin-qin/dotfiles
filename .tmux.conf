# ==========================
# General Settings
# ==========================

# Enable mouse support (scroll, resize, select)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Use 256 colors
set -g default-terminal "screen-256color"

# ==========================
# Appearance & Theme
# ==========================

# 1. Status Bar Layout
set -g status-position bottom       # Bar at bottom (default)
set -g status-justify left          # Left-align window list
set -g status-left-length 100        # Allow long session names
set -g status-right-length 100       # Allow long date/time

# 2. Colors
# Status Bar: Dark gray background, soft white text
set -g status-style bg=colour235,fg=colour136

# Window List: Grey for inactive windows
setw -g window-status-style fg=colour244,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Active Window: Orange/White highlight, bold
setw -g window-status-current-style fg=colour166,bg=colour235,bold
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour50]#F '

# Status Left: Soft Blue session name
set -g status-left " #[fg=colour33,bold][#S]#[default] "

# Status Right: Date and Time in soft gold
set -g status-right "#[fg=colour136] %H:%M %d-%b-%y "

# 3. Pane Borders (Since you use 'pane-border-status top')
# (Options: single, double, heavy, simple, number)
set -g pane-border-lines simple

# Ensure the background is 'default' (transparent) to avoid blocks
# Inactive border: Dark gray
set -g pane-border-style bg=default,fg=colour238

# Active border: Cyan
set -g pane-active-border-style bg=default,fg=colour51

# ==========================
# Key Bindings
# ==========================

# Remap prefix from 'C-b' to 'C-a' (optional, commonly used)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config with <prefix> + r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Pane Renaming (Custom shortcut <prefix> + R)
set -g pane-border-status top
set -g pane-border-format " [ ###P #T ] "
bind R command-prompt -p "Rename Pane:" "select-pane -T '%%'"

# ==========================
# Copy Mode (Vim Style)
# ==========================

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Setup 'y' to copy selection as in Vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================
# Plugins
# ==========================

# Define the custom path for TPM plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Resurrect: Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Optional: Automatically save sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings: restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
